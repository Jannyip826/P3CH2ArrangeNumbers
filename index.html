<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="數卡變五位數">
    <title>數卡變五位數</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+TC:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff8fb3;
            --mint: #6fe0c0;
            --sky: #6ec8ff;
            --lemon: #ffe066;
            --lilac: #c9a7ff;
            --coral: #ff7a6e;
            --orange: #ffb347;
            --ink: #2a1848;
            --slot-h: clamp(85px, 20vh, 145px);
            --slot-w: clamp(62px, 9vw, 115px);
            --digit-h: clamp(70px, 16vh, 115px);
            --digit-w: clamp(52px, 7.5vw, 98px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            color: #3b2a4a;
            background:
                radial-gradient(ellipse 70% 40% at 12% 0%, #fff4c4 0%, transparent 55%),
                radial-gradient(ellipse 60% 45% at 92% 8%, #ffd4ea 0%, transparent 52%),
                radial-gradient(ellipse 50% 35% at 50% 100%, #b8f0c8 0%, transparent 50%),
                linear-gradient(180deg, #9adaff 0%, #e8f7ff 42%, #d4f5c2 100%);
        }

        h1, h2, .fun-font { font-family: 'ZCOOL KuaiLe', 'Noto Sans TC', sans-serif; }

        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
            z-index: 2;
        }
        .screen.active { display: flex; }
        .screen[hidden] { display: none !important; }

        .sky-deco, .ground-deco { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

        .sun {
            position: absolute;
            top: 10px;
            right: 7%;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd24a 55%, #ffb347);
            box-shadow: 0 0 0 8px rgba(255, 210, 74, 0.28), 0 0 28px rgba(255, 180, 50, 0.55);
            animation: pulse-soft 3s ease-in-out infinite;
        }

        .rainbow {
            position: absolute;
            top: -10px;
            left: 22%;
            width: 220px;
            height: 110px;
            border-radius: 220px 220px 0 0;
            border: 10px solid #ff8fb3;
            border-bottom: none;
            box-shadow:
                0 -12px 0 #ffb347,
                0 -22px 0 #ffe066,
                0 -32px 0 #6fe0c0,
                0 -42px 0 #6ec8ff,
                0 -52px 0 #c9a7ff;
            opacity: 0.85;
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 40px;
            filter: drop-shadow(0 6px 0 rgba(255,255,255,0.4));
            opacity: 0.88;
        }
        .cloud::before, .cloud::after {
            content: "";
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .c1 { width: 120px; height: 34px; top: 22px; left: 5%; animation: drift 9s ease-in-out infinite; }
        .c1::before { width: 44px; height: 44px; left: 16px; top: -20px; }
        .c1::after { width: 58px; height: 58px; left: 46px; top: -30px; }
        .c2 { width: 90px; height: 28px; top: 58px; right: 18%; animation: floaty 4s ease-in-out infinite; }
        .c2::before { width: 34px; height: 34px; left: 10px; top: -14px; }
        .c2::after { width: 46px; height: 46px; left: 34px; top: -22px; }

        .deco {
            position: absolute;
            font-size: 1.8rem;
            line-height: 1;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.08));
        }

        .grass {
            position: absolute;
            left: 0; right: 0; bottom: -6px;
            height: 42px;
            background:
                radial-gradient(circle at 8% 0, #8fd46a 16px, transparent 17px),
                radial-gradient(circle at 20% 8px, #7bc85a 14px, transparent 15px),
                radial-gradient(circle at 34% 0, #97dd72 18px, transparent 19px),
                radial-gradient(circle at 50% 10px, #7bc85a 13px, transparent 14px),
                radial-gradient(circle at 66% 0, #8fd46a 17px, transparent 18px),
                radial-gradient(circle at 80% 8px, #97dd72 14px, transparent 15px),
                radial-gradient(circle at 94% 0, #7bc85a 16px, transparent 17px);
            opacity: 0.6;
        }

        .panel {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border: 3px solid #fff;
            box-shadow: 0 8px 0 rgba(255,143,179,0.16), 0 14px 22px rgba(80,50,80,0.08);
            border-radius: 24px;
        }

        .btn {
            border: 3px solid #fff;
            border-radius: 18px;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 0 rgba(0,0,0,0.12);
            transition: transform 0.12s, box-shadow 0.12s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        .btn-play { background: linear-gradient(#ffe066, #ffb347); color: #7a3b00; font-size: 1.45rem; padding: 14px 42px; }
        .btn-check { background: linear-gradient(#6fe0c0, #3ecf9a); color: #0b4d38; }
        .btn-next { background: linear-gradient(#c9a7ff, #a078f0); color: #3b1d78; }
        .btn-reset { background: linear-gradient(#ffe066, #ffc44d); color: #6b4300; }
        .btn-icon {
            width: 44px; height: 44px;
            display: grid; place-items: center;
            background: #e8f6ff; color: #2a6ea8; font-size: 1.15rem;
        }
        .btn-ghost { background: #fff0f6; color: #c44d78; }

        header.play-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 12px;
            z-index: 3;
            flex-shrink: 0;
        }

        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-icon {
            width: 48px; height: 48px; border-radius: 16px;
            display: grid; place-items: center; font-size: 1.7rem;
            background: linear-gradient(#ffb3c9, #ff7aa2);
            border: 3px solid #fff;
            animation: bounce-soft 2.6s ease-in-out infinite;
        }
        .brand h1 { font-size: clamp(1.15rem, 2.4vw, 1.7rem); color: #e0568c; letter-spacing: 1px; }
        .brand p { font-size: 0.72rem; color: #8a6a88; font-weight: 800; }

        .hud { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        .chip {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 16px;
            font-weight: 900; font-size: 0.92rem;
            border: 2px solid rgba(255,255,255,0.9);
        }
        .chip-level { background: #fff3c4; color: #8a5a00; }
        .chip-star { background: #d9fff0; color: #0d6b4d; }
        .progress-dots { display: flex; gap: 5px; align-items: center; padding: 0 4px; }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #e4d4ea; border: 2px solid #fff;
        }
        .dot.done { background: #6fe0c0; }
        .dot.now { background: #ff8fb3; transform: scale(1.25); }
        .dot.mix { border-radius: 3px; transform: rotate(45deg); background: #c9a7ff; width: 11px; height: 11px; }
        .dot.mix.done { background: #a078f0; }
        .dot.mix.now { background: #ffb347; transform: rotate(45deg) scale(1.2); }

        .play-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 1180px;
            width: 100%;
            margin: 6px auto 0;
            z-index: 3;
            min-height: 0;
        }

        .mission {
            display: flex;
            align-items: stretch;
            gap: 10px;
            flex-shrink: 0;
        }

        .mascot-wrap { width: 72px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .mascot {
            width: 64px; height: 64px;
            font-size: 2.6rem;
            display: grid; place-items: center;
            animation: bounce-soft 2.8s ease-in-out infinite;
            filter: drop-shadow(0 6px 0 rgba(0,0,0,0.08));
        }
        .speech {
            flex: 1;
            position: relative;
            padding: 8px 16px 8px 18px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .speech::before {
            content: "";
            position: absolute;
            left: -10px; top: 28px;
            border: 10px solid transparent;
            border-right-color: #fff;
        }
        .speech .tag {
            font-size: 0.7rem; font-weight: 900; color: #e0568c; letter-spacing: 1px;
        }
        .speech .line {
            font-size: clamp(0.98rem, 2vw, 1.28rem);
            font-weight: 900;
            color: #3b2a4a;
            line-height: 1.35;
        }
        .speech .hint-line {
            margin-top: 3px;
            font-size: 0.88rem;
            font-weight: 800;
            color: #6b4c9a;
        }
        .speech .hint-line:empty { display: none; }
        .speech .hint-line.show-hint,
        .speech .hint-line.show-reward {
            display: block;
            border-radius: 12px;
            padding: 6px 10px;
        }
        .speech .hint-line.show-hint {
            background: #fff6d8;
            border: 2px solid #ffe066;
            color: #6b4300;
        }
        .speech .hint-line.show-reward {
            background: #d9fff0;
            border: 2px solid #6fe0c0;
            color: #0d6b4d;
        }
        .req-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .req-row.emphasize .req-chip {
            animation: pop-star 0.45s ease;
            box-shadow: 0 0 0 3px rgba(255, 224, 102, 0.85);
        }
        .req-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 0.82rem;
            border: 2px solid #fff;
        }
        .req-max { background: #ffd0e6; color: #8a2258; }
        .req-min { background: #bfeaff; color: #0d4e78; }
        .req-odd { background: #ead9ff; color: #4b2a86; }
        .req-even { background: #c8ffe8; color: #0b4d38; }
        .req-gt { background: #ffe0b8; color: #8a4300; }
        .req-lt { background: #fff3c4; color: #7a5a00; }

        .board {
            flex: 1;
            display: grid;
            grid-template-columns: 1.35fr 0.65fr;
            gap: 10px;
            min-height: 0;
        }

        .slots-box, .pool-box {
            padding: 8px 10px 10px;
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .box-label {
            text-align: center;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .slots-box .box-label { color: #e0568c; }
        .pool-box {
            background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(126,200,255,0.22));
            border: 3px dashed #8fd0ff;
            border-radius: 24px;
        }
        .pool-box .box-label { color: #2a6ea8; }

        .place-row {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(4px, 1vw, 14px);
            min-height: 0;
            flex-wrap: nowrap;
        }

        .place {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .slot {
            width: var(--slot-w);
            height: var(--slot-h);
            border: 3px dashed #ffc2d6;
            border-radius: 18px;
            background:
                radial-gradient(circle at 50% 42%, rgba(255,255,255,0.95) 0 28%, transparent 29%),
                rgba(255,255,255,0.55);
            display: grid;
            place-items: center;
            position: relative;
            flex-shrink: 0;
            transition: 0.15s;
        }
        .slot::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 14px;
            border: 2px dashed rgba(255, 143, 179, 0.28);
            pointer-events: none;
        }
        .slot.filled { border-style: solid; background: #fff; border-color: #ff8fb3; box-shadow: 0 6px 0 rgba(255,143,179,0.18); }
        .slot.filled::after { display: none; }
        .slot-ph { color: #ffc2d6; font-weight: 900; font-size: 1.4rem; opacity: 0.7; }
        .slot-highlight { border-color: #ff8fb3 !important; background: #fff0f6 !important; transform: scale(1.05); }

        .formed {
            text-align: center;
            font-weight: 900;
            color: #5b3a8c;
            font-size: clamp(0.9rem, 1.6vw, 1.15rem);
            padding: 2px 0 4px;
            flex-shrink: 0;
        }
        .formed b {
            font-size: 1.25em;
            color: #e0568c;
            letter-spacing: 2px;
            font-family: 'Nunito', sans-serif;
        }

        #pool {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1vw, 12px);
            min-height: 0;
            flex-wrap: wrap;
        }

        .pool-slot {
            width: var(--digit-w);
            height: var(--digit-h);
            display: grid;
            place-items: center;
        }

        .num-card {
            width: 100%; height: 100%;
            border-radius: 16px;
            border: 3px solid #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: grab;
            position: relative;
            color: #fff;
            box-shadow: 0 6px 0 rgba(0,0,0,0.14), 0 10px 14px rgba(0,0,0,0.08);
            transition: transform 0.12s;
            touch-action: none;
        }
        .num-card:active { cursor: grabbing; }
        .num-card.selected { outline: 4px solid #ffe066; transform: scale(1.05); }
        .card-animal { position: absolute; top: 3px; left: 5px; font-size: 0.95rem; }
        .card-digit {
            font-size: clamp(2rem, 5.5vh, 3.4rem);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 3px 0 rgba(0,0,0,0.18);
        }

        .theme-0 { background: linear-gradient(160deg, #ff9ec0, #ff5e8a); }
        .theme-1 { background: linear-gradient(160deg, #7ed4ff, #3aa4f0); }
        .theme-2 { background: linear-gradient(160deg, #ffd56a, #ff9f2e); }
        .theme-3 { background: linear-gradient(160deg, #cbb0ff, #8b62f0); }
        .theme-4 { background: linear-gradient(160deg, #7eecc8, #2fc392); }
        .theme-5 { background: linear-gradient(160deg, #ff9272, #e04838); }

        .dragging {
            opacity: 0.95;
            z-index: 1000 !important;
            pointer-events: none;
            position: fixed !important;
            transform: scale(1.08) rotate(-3deg);
        }

        footer.play-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            z-index: 3;
            gap: 10px;
            flex-shrink: 0;
        }
        .footer-btns { display: flex; gap: 10px; align-items: center; }
        .footer-btns .btn { padding: 10px 22px; font-size: 1.05rem; }

        .shake { animation: shake 0.42s ease-in-out; }

        .overlay-card {
            max-width: 560px;
            width: min(92vw, 560px);
            padding: 22px 26px 20px;
            text-align: center;
            position: relative;
        }
        .overlay-emoji { font-size: 3.2rem; line-height: 1; margin-bottom: 6px; }
        .overlay-card h2 { font-size: 2rem; color: #e0568c; margin-bottom: 8px; }
        .overlay-card p { font-weight: 800; color: #5a4560; line-height: 1.55; }
        .feature-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 14px 0 18px;
        }
        .feature {
            background: #fff;
            border-radius: 16px;
            padding: 10px 12px;
            min-width: 0;
            border: 2px solid #ffe0ef;
            font-weight: 800;
            font-size: 0.85rem;
        }
        .feature span { display: block; font-size: 1.5rem; margin-bottom: 2px; }

        .start-hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }
        .sample-cards { display: flex; gap: 8px; justify-content: center; margin: 12px 0 4px; }
        .mini-card {
            width: 52px; height: 60px; border-radius: 12px;
            display: grid; place-items: center;
            color: #fff; font-weight: 900; font-size: 1.5rem;
            border: 2px solid #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
        }

        .end-stars { font-size: 2.4rem; letter-spacing: 4px; margin: 8px 0; }
        .end-score { font-size: 2.6rem; font-weight: 900; color: #e0568c; }
        .sticker-row { font-size: 1.8rem; letter-spacing: 6px; margin: 8px 0; }

        #modal-layer {
            position: fixed; inset: 0;
            background: rgba(40, 20, 50, 0.45);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
            padding: 16px;
        }
        #modal-layer.show { display: flex; }

        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; display: none; }

        #rotate-hint {
            display: none;
            position: fixed; inset: 0;
            background: #9adaff;
            z-index: 80;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 24px;
        }
        #rotate-hint .phone {
            font-size: 4rem;
            animation: tilt 1.4s ease-in-out infinite;
        }

        @media (orientation: portrait) and (max-width: 900px) {
            #rotate-hint { display: flex; }
        }

        @media (max-width: 900px) {
            .board { grid-template-columns: 1fr; }
        }

        @keyframes tilt {
            0%, 100% { transform: rotate(0deg); }
            40% { transform: rotate(90deg); }
            60% { transform: rotate(90deg); }
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes drift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(16px); }
        }
        @keyframes bounce-soft {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-7px) scale(1.05); }
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.45; transform: scale(0.9) rotate(0); }
            50% { opacity: 1; transform: scale(1.15) rotate(12deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        @keyframes pop-star {
            0% { transform: scale(0.6); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        .pop { animation: pop-star 0.45s ease; }

        .twinkle { animation: twinkle 2.2s ease-in-out infinite; }
        .floaty { animation: floaty 3.4s ease-in-out infinite; }
        .floaty-d { animation: floaty 4.2s ease-in-out infinite 0.6s; }

        @media (max-height: 860px) {
            :root { --slot-h: 100px; --digit-h: 88px; }
            .speech .line { font-size: clamp(0.9rem, 1.8vw, 1.12rem); }
            .formed { font-size: 0.95rem; }
        }
        @media (max-height: 740px) {
            :root { --slot-h: 85px; --digit-h: 75px; }
            .mascot { width: 56px; height: 56px; font-size: 2.2rem; }
            .speech { padding: 6px 12px; }
            .brand-icon { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <div class="sky-deco">
        <div class="rainbow"></div>
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <span class="deco twinkle" style="top:18px;left:48%;">⭐</span>
        <span class="deco twinkle" style="top:42px;left:58%;animation-delay:.7s;">✨</span>
        <span class="deco floaty" style="top:78px;left:2%;font-size:2.2rem;">🎈</span>
        <span class="deco floaty-d" style="top:86px;right:3%;font-size:2.2rem;">🎈</span>
        <span class="deco floaty" style="top:96px;left:16%;">🦋</span>
        <span class="deco floaty-d" style="top:110px;right:14%;">🐝</span>
    </div>
    <div class="ground-deco">
        <div class="grass"></div>
        <span class="deco" style="bottom:8px;left:10%;">🌸</span>
        <span class="deco" style="bottom:6px;left:26%;">🌼</span>
        <span class="deco" style="bottom:10px;left:72%;">🌷</span>
        <span class="deco" style="bottom:7px;right:16%;">🌻</span>
        <span class="deco floaty" style="bottom:70px;left:8px;font-size:2.3rem;">🐻</span>
        <span class="deco floaty-d" style="bottom:108px;left:42px;font-size:1.8rem;">🐰</span>
        <span class="deco floaty" style="bottom:70px;right:10px;font-size:2.3rem;">🐼</span>
        <span class="deco floaty-d" style="bottom:112px;right:44px;font-size:1.8rem;">🦊</span>
    </div>

    <section id="start-screen" class="screen active">

    <script>
        const ANIMALS = ['🐻', '🐰', '🐱', '🐶', '🐼', '🦊', '🐸', '🦉'];
        const STICKERS = ['🌟', '🏆', '🌈', '🎉', '🥳', '🍭', '🦄', '🎁'];
        const PRAISE = [
            { title: '太棒了！', text: '你排出了完全符合要求的五位數！', emoji: '🌟' },
            { title: '完全正確！', text: '五張數卡都排得剛剛好！', emoji: '🏆' },
            { title: '超級厲害！', text: '小動物們都為你鼓掌！', emoji: '🥳' },
            { title: '做得好！', text: '你已經會按要求排出五位數了！', emoji: '🎉' },
            { title: '眼睛真利！', text: '要求再多也難不倒你！', emoji: '🌈' }
        ];
        
        // 1-6為5張卡排5位數，7-12為進階6張卡排5位數(需6選5)
        const STAGE_SPECS = [
            { cardCount: 5, max: true },
            { cardCount: 5, min: true },
            { cardCount: 5, parity: 'odd' },
            { cardCount: 5, parity: 'even' },
            { cardCount: 5, compareOp: 'gt' },
            { cardCount: 5, compareOp: 'lt' },
            { cardCount: 6, max: true },
            { cardCount: 6, mix: 'maxParity' },
            { cardCount: 6, mix: 'altParity' },
            { cardCount: 6, mix: 'parityCompare' },
            { cardCount: 6, mix: 'maxMinCompare' },
            { cardCount: 6, mix: 'triple' }
        ];

        let QUESTIONS = [];

        function randInt(min, max) {
            return min + Math.floor(Math.random() * (max - min + 1));
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function permute(arr) {
            if (arr.length <= 1) return [arr.slice()];
            const out = [];
            arr.forEach((item, i) => {
                const rest = arr.slice(0, i).concat(arr.slice(i + 1));
                permute(rest).forEach(p => out.push([item, ...p]));
            });
            return out;
        }

        function combinations(arr, k) {
            if (k === 0) return [[]];
            if (k > arr.length) return [];
            const out = [];
            for (let i = 0; i <= arr.length - k; i++) {
                combinations(arr.slice(i + 1), k - 1).forEach(c => out.push([arr[i], ...c]));
            }
            return out;
        }

        // 從卡片中選出 5 張組合並排列成五位數
        function allArrangements(digits) {
            const indexed = digits.map((d, i) => ({ d, i }));
            const results = [];
            const seen = new Set();
            combinations(indexed, 5).forEach(combo => {
                permute(combo).forEach(perm => {
                    if (perm[0].d === 0) return; // 萬位不能為 0
                    const n = perm[0].d * 10000 + perm[1].d * 1000 + perm[2].d * 100 + perm[3].d * 10 + perm[4].d;
                    const usedIdx = new Set(perm.map(x => x.i));
                    const unused = indexed.filter(x => !usedIdx.has(x.i)).map(x => x.d);
                    const key = n + '|' + unused.slice().sort((a, b) => a - b).join(',');
                    if (seen.has(key)) return;
                    seen.add(key);
                    results.push({ n, used: perm.map(x => x.d), unused });
                });
            });
            return results;
        }

        function applyFilters(arrangements, req) {
            let f = arrangements;
            if (req.parity === 'odd') f = f.filter(a => a.n % 2 === 1);
            if (req.parity === 'even') f = f.filter(a => a.n % 2 === 0);
            if (req.compare) {
                if (req.compare.op === 'gt') f = f.filter(a => a.n > req.compare.value);
                if (req.compare.op === 'lt') f = f.filter(a => a.n < req.compare.value);
            }
            if (req.max && f.length) {
                const m = Math.max(...f.map(a => a.n));
                f = f.filter(a => a.n === m);
            }
            if (req.min && f.length) {
                const m = Math.min(...f.map(a => a.n));
                f = f.filter(a => a.n === m);
            }
            return f;
        }

        function pickThreshold(nums, op) {
            const candidates = [20000, 30000, 40000, 50000, 60000, 70000, 80000];
            const good = candidates.filter(T => {
                if (op === 'gt') return nums.some(n => n > T) && nums.some(n => n <= T);
                return nums.some(n => n < T) && nums.some(n => n >= T);
            });
            if (!good.length) return null;
            return good[randInt(0, good.length - 1)];
        }

        function randomDigits(count, need) {
            for (let t = 0; t < 80; t++) {
                const digits = [];
                digits.push(randInt(1, 9));
                while (digits.length < count) {
                    let d = randInt(0, 9);
                    if (need && need.zero && !digits.includes(0) && digits.length === count - 1) d = 0;
                    if (digits.includes(d) && Math.random() < 0.88) continue;
                    digits.push(d);
                }
                if (need && need.odd && !digits.some(d => d % 2 === 1)) continue;
                if (need && need.even && !digits.some(d => d % 2 === 0)) continue;
                if (digits.filter(d => d !== 0).length < 1) continue;
                if (new Set(digits).size < Math.min(count, 5)) continue;
                return shuffle(digits);
            }
            return shuffle(count === 5 ? [2, 4, 5, 7, 8] : [2, 4, 5, 7, 8, 0]);
        }

        function blankReq(cardCount) {
            return { max: false, min: false, parity: null, compare: null, compareOp: null, cardCount };
        }

        function specToReq(spec) {
            const req = blankReq(spec.cardCount);
            if (spec.max) req.max = true;
            if (spec.min) req.min = true;
            if (spec.parity) req.parity = spec.parity;
            if (spec.compareOp) req.compareOp = spec.compareOp;

            if (spec.mix === 'maxParity') {
                if (Math.random() < 0.5) { req.max = true; req.parity = 'odd'; }
                else { req.min = true; req.parity = 'even'; }
            } else if (spec.mix === 'altParity') {
                if (Math.random() < 0.5) { req.max = true; req.parity = 'even'; }
                else { req.min = true; req.parity = 'odd'; }
            } else if (spec.mix === 'parityCompare') {
                req.parity = Math.random() < 0.5 ? 'odd' : 'even';
                req.compareOp = Math.random() < 0.5 ? 'gt' : 'lt';
            } else if (spec.mix === 'maxMinCompare') {
                if (Math.random() < 0.5) { req.max = true; req.compareOp = 'lt'; }
                else { req.min = true; req.compareOp = 'gt'; }
            } else if (spec.mix === 'triple') {
                const packs = [
                    { max: true, parity: 'odd', compareOp: 'gt' },
                    { max: true, parity: 'even', compareOp: 'lt' },
                    { min: true, parity: 'even', compareOp: 'gt' },
                    { min: true, parity: 'odd', compareOp: 'lt' },
                    { max: true, parity: 'odd', compareOp: 'lt' }
                ];
                Object.assign(req, packs[randInt(0, packs.length - 1)]);
            }
            return req;
        }

        function extraConstraintsMatter(all, req) {
            const hasExtra = req.parity || req.compare;
            if (!hasExtra || !(req.max || req.min)) return true;
            const onlyExt = applyFilters(all, { max: req.max, min: req.min, parity: null, compare: null });
            const withExtra = applyFilters(all, req);
            if (!onlyExt.length || !withExtra.length) return false;
            return onlyExt[0].n !== withExtra[0].n;
        }

        function isGoodPuzzle(all, valid, req) {
            if (!valid.length) return false;
            const allNums = [...new Set(all.map(a => a.n))];
            const validNums = [...new Set(valid.map(a => a.n))];
            if (req.max || req.min) {
                if (validNums.length !== 1) return false;
                if (!extraConstraintsMatter(all, req)) return false;
            } else if (validNums.length < 2 || validNums.length === allNums.length) {
                return false;
            }
            if (req.compare) {
                const T = req.compare.value;
                if (req.compare.op === 'gt' && !allNums.some(n => n <= T)) return false;
                if (req.compare.op === 'lt' && !allNums.some(n => n >= T)) return false;
            }
            return true;
        }

        function reqChips(req) {
            const chips = [];
            if (req.max) chips.push({ cls: 'req-max', text: '最大的' });
            if (req.min) chips.push({ cls: 'req-min', text: '最小的' });
            if (req.parity === 'odd') chips.push({ cls: 'req-odd', text: '奇數' });
            if (req.parity === 'even') chips.push({ cls: 'req-even', text: '偶數' });
            if (req.compare && req.compare.op === 'gt') chips.push({ cls: 'req-gt', text: '比' + req.compare.value + '大' });
            if (req.compare && req.compare.op === 'lt') chips.push({ cls: 'req-lt', text: '比' + req.compare.value + '小' });
            return chips;
        }

        function mixCount(req) {
            return (req.max ? 1 : 0) + (req.min ? 1 : 0) + (req.parity ? 1 : 0) + (req.compare ? 1 : 0);
        }

        function targetPhrase(req) {
            const T = req.compare ? req.compare.value : 0;
            const compare = req.compare
                ? (req.compare.op === 'gt' ? `比${T}大的` : `比${T}小的`)
                : '';
            const size = req.max ? '最大的' : req.min ? '最小的' : '';
            const kind = req.parity === 'odd' ? '奇數' : req.parity === 'even' ? '偶數' : '數';
            return `${compare}${size}五位${kind}`;
        }

        function introText(req) {
            const extraCardText = req.cardCount === 6 ? '（從 6 張卡中選 5 張）' : '';
            const n = mixCount(req);
            if (n >= 2) return `請排出${targetPhrase(req)}${extraCardText}。`;
            if (req.max) return `請排出最大的五位數${extraCardText}。`;
            if (req.min) return `請排出最小的五位數${extraCardText}。`;
            if (req.parity === 'odd') return `請排出一個五位奇數${extraCardText}。`;
            if (req.parity === 'even') return `請排出一個五位偶數${extraCardText}。`;
            if (req.compare && req.compare.op === 'gt') return `請排出一個比${req.compare.value}大的五位數${extraCardText}。`;
            if (req.compare && req.compare.op === 'lt') return `請排出一個比${req.compare.value}小的五位數${extraCardText}。`;
            return `請排出${targetPhrase(req)}${extraCardText}。`;
        }

        function hintPack(req, valid, all) {
            const sample = valid[0];
            const T = req.compare ? req.compare.value : 0;
            const unique = [...new Set(valid.map(a => a.n))];
            const conceptual = [];
            if (req.parity === 'odd') conceptual.push('奇數的個位一定是 1、3、5、7 或 9。');
            if (req.parity === 'even') conceptual.push('偶數的個位一定是 0、2、4、6 或 8。');
            if (req.max) conceptual.push('想要最大，先把最大的可用數字放在萬位。');
            if (req.min) conceptual.push('想要最小，萬位要放最小的「不是 0」的數字。');
            if (req.compare && req.compare.op === 'gt') conceptual.push(`比 ${T} 大，萬位通常要比 ${String(T)[0]} 更大，或萬位相同時後面的數字要更大。`);
            if (req.compare && req.compare.op === 'lt') conceptual.push(`比 ${T} 小，萬位通常要比 ${String(T)[0]} 更小，或萬位相同時後面的數字要更小。`);

            const stronger = [];
            if (req.max || req.min) {
                stronger.push(`符合要求的答案是 ${sample.n}。萬位放 ${sample.used[0]}，千位放 ${sample.used[1]}，百位放 ${sample.used[2]}，十位放 ${sample.used[3]}，個位放 ${sample.used[4]}。`);
            } else {
                const ones = [...new Set(valid.map(a => a.used[4]))].sort((a, b) => a - b);
                const tenThos = [...new Set(valid.map(a => a.used[0]))].sort((a, b) => a - b);
                stronger.push(`個位可以是 ${ones.join('、')}，萬位可以是 ${tenThos.join('、')}。例如 ${unique.slice(0, 2).join(' 或 ')}。`);
            }

            return {
                conceptual: conceptual.join(''),
                hundred: `先決定萬位。這題萬位可以是 ${[...new Set(valid.map(a => a.used[0]))].sort((a,b)=>a-b).join('、')}。`,
                answer: stronger[0]
            };
        }

        function diagnose(studentN, leadingZero, req, valid) {
            if (leadingZero) return '萬位放了 0，這就不是五位數了。請把 0 放在千、百、十或個位。';
            const bits = [];
            if (req.parity === 'odd' && studentN % 2 === 0) bits.push(`你排出的 ${studentN} 是偶數。請把個位換成 1、3、5、7 或 9。`);
            if (req.parity === 'even' && studentN % 2 === 1) bits.push(`你排出的 ${studentN} 是奇數。請把個位換成 0、2、4、6 或 8。`);
            if (req.compare && req.compare.op === 'gt' && studentN <= req.compare.value) {
                bits.push(`${studentN} 沒有比 ${req.compare.value} 大。試試把更大的數字放在萬位。`);
            }
            if (req.compare && req.compare.op === 'lt' && studentN >= req.compare.value) {
                bits.push(`${studentN} 沒有比 ${req.compare.value} 小。試試把較小的數字放在萬位。`);
            }
            if (req.max && !valid.some(a => a.n === studentN)) {
                bits.push('這還不是最大的。把最大的可用數字放在萬位，再比較千位與百位。');
            }
            if (req.min && !valid.some(a => a.n === studentN)) {
                bits.push('這還不是最小的。萬位先放最小的非 0 數字，剩下再由小到大排。');
            }
            if (!bits.length) bits.push('這個數還沒完全符合所有要求，再對照上面的彩色標籤看一次。');
            return bits[0];
        }

        const FALLBACKS = [
            { digits: [2, 3, 5, 7, 8], max: true },
            { digits: [0, 1, 3, 6, 7], min: true },
            { digits: [2, 4, 5, 8, 9], parity: 'odd' },
            { digits: [1, 3, 5, 6, 8, 9], parity: 'even' },
            { digits: [2, 3, 5, 7, 8], compareOp: 'gt', compare: { op: 'gt', value: 50000 } },
            { digits: [1, 2, 4, 6, 8, 9], compareOp: 'lt', compare: { op: 'lt', value: 50000 } },
            { digits: [2, 4, 5, 7, 8, 1], max: true, parity: 'odd' },
            { digits: [1, 3, 6, 7, 8, 2], max: true, parity: 'even' },
            { digits: [0, 2, 3, 6, 7, 8], parity: 'even', compare: { op: 'gt', value: 40000 } },
            { digits: [2, 3, 4, 7, 8, 9], max: true, compare: { op: 'lt', value: 70000 } },
            { digits: [1, 2, 4, 7, 9, 3], parity: 'odd', compare: { op: 'gt', value: 40000 } },
            { digits: [1, 3, 4, 6, 8, 9], max: true, parity: 'odd', compare: { op: 'gt', value: 30000 } }
        ];

        function makeQuestionFrom(digits, req, id) {
            const all = allArrangements(digits);
            const valid = applyFilters(all, req);
            const mixed = req.cardCount === 6 || mixCount(req) >= 2;
            return {
                id,
                digits,
                req,
                all,
                valid,
                mixed,
                intro: introText(req),
                chips: reqChips(req),
                hints: hintPack(req, valid, all)
            };
        }

        function generateQuestion(spec, id, usedKeys) {
            for (let attempt = 0; attempt < 90; attempt++) {
                const req = specToReq(spec);
                const need = {
                    odd: req.parity === 'odd' || (req.max && req.parity === 'odd'),
                    even: req.parity === 'even' || req.min,
                    zero: req.min && Math.random() < 0.55
                };
                const digits = randomDigits(spec.cardCount, need);
                const all = allArrangements(digits);
                if (!all.length) continue;
                if (req.compareOp) {
                    const T = pickThreshold([...new Set(all.map(a => a.n))], req.compareOp);
                    if (T == null) continue;
                    req.compare = { op: req.compareOp, value: T };
                }
                const valid = applyFilters(all, req);
                if (!isGoodPuzzle(all, valid, req)) continue;
                const key = digits.slice().sort((a, b) => a - b).join(',') + JSON.stringify(reqChips(req));
                if (usedKeys.has(key)) continue;
                usedKeys.add(key);
                return makeQuestionFrom(digits, req, id);
            }
            const fb = FALLBACKS[(id - 1) % FALLBACKS.length];
            const req = blankReq(fb.digits.length);
            Object.assign(req, fb);
            delete req.digits;
            return makeQuestionFrom(fb.digits, req, id);
        }

        function generateRound() {
            const used = new Set();
            return STAGE_SPECS.map((spec, i) => generateQuestion(spec, i + 1, used));
        }

        class SoundFX {
            constructor() { this.ctx = null; this.muted = false; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            tone(freq, type, duration, vol = 0.18) {
                if (this.muted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            pick() { this.tone(420, 'sine', 0.1, 0.14); }
            drop() { this.tone(290, 'triangle', 0.12, 0.18); }
            success() {
                [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 'sine', 0.28, 0.2), i * 90));
            }
            error() {
                this.tone(220, 'sawtooth', 0.18, 0.22);
                setTimeout(() => this.tone(170, 'sawtooth', 0.26, 0.22), 140);
            }
        }

        const sound = new SoundFX();

        const els = {
            start: document.getElementById('start-screen'),
            play: document.getElementById('play-screen'),
            slots: document.getElementById('slots'),
            pool: document.getElementById('pool'),
            poolLabel: document.getElementById('pool-label'),
            mascot: document.getElementById('mascot'),
            speechLine: document.getElementById('speech-line'),
            hintLine: document.getElementById('hint-line'),
            stageTag: document.getElementById('stage-tag'),
            reqRow: document.getElementById('req-row'),
            formed: document.getElementById('formed'),
            levelText: document.getElementById('level-text'),
            starText: document.getElementById('star-text'),
            dots: document.getElementById('progress-dots'),
            checkBtn: document.getElementById('check-btn'),
            nextBtn: document.getElementById('next-btn'),
            resetBtn: document.getElementById('reset-btn'),
            soundBtn: document.getElementById('sound-btn'),
            homeBtn: document.getElementById('home-btn'),
            startBtn: document.getElementById('start-btn'),
            modal: document.getElementById('modal-layer'),
            modalCard: document.getElementById('modal-card')
        };

        let qIndex = 0;
        let stars = 0;
        let tries = 0;
        let locked = false;
        let cards = [];
        let slots = [null, null, null, null, null]; // 5 個答案格
        let pool = [];
        let selectedId = null;
        let drag = null;
        let ghost = null;
        let stickers = [];

        function showScreen(name) {
            els.start.classList.toggle('active', name === 'start');
            els.play.classList.toggle('active', name === 'play');
            els.start.toggleAttribute('hidden', name !== 'start');
            els.play.toggleAttribute('hidden', name !== 'play');
            els.start.setAttribute('aria-hidden', name !== 'start');
            els.play.setAttribute('aria-hidden', name !== 'play');
        }

        function currentQ() { return QUESTIONS[qIndex]; }

        function lastEasyIndex() {
            let idx = -1;
            QUESTIONS.forEach((q, i) => { if (!q.mixed) idx = i; });
            return idx;
        }

        function makeCards(q) {
            return q.digits.map((d, i) => ({
                id: 'c' + q.id + '-' + i + '-' + d,
                digit: d,
                animal: ANIMALS[i % ANIMALS.length],
                theme: 'theme-' + (i % 6)
            }));
        }

        function renderDots() {
            els.dots.innerHTML = QUESTIONS.map((q, i) => {
                const cls = [
                    'dot',
                    q.mixed ? 'mix' : '',
                    i < qIndex ? 'done' : '',
                    i === qIndex ? 'now' : ''
                ].join(' ');
                return `<span class="${cls}"></span>`;
            }).join('');
        }

        function setSpeech(line, hint = '', mascot = '🦊', kind = '') {
            els.speechLine.textContent = line;
            els.hintLine.textContent = hint;
            els.hintLine.classList.toggle('show-hint', Boolean(hint) && kind !== 'reward');
            els.hintLine.classList.toggle('show-reward', Boolean(hint) && kind === 'reward');
            els.mascot.textContent = mascot;
        }

        function renderHeader() {
            const q = currentQ();
            const easyTotal = QUESTIONS.filter(x => !x.mixed).length;
            const mixTotal = QUESTIONS.filter(x => x.mixed).length;
            if (q.mixed) {
                const mixI = QUESTIONS.slice(0, qIndex + 1).filter(x => x.mixed).length;
                els.levelText.textContent = `進階 ${mixI} / ${mixTotal}`;
                els.stageTag.textContent = q.digits.length === 6 ? '進階：6選5挑戰' : '進階挑戰';
            } else {
                els.levelText.textContent = `練習 ${qIndex + 1} / ${easyTotal}`;
                els.stageTag.textContent = '基礎練習';
            }
            els.starText.textContent = stars;
            renderDots();
            els.reqRow.innerHTML = q.chips.map(c => `<span class="req-chip ${c.cls}">${c.text}</span>`).join('');
            els.reqRow.classList.remove('emphasize');
            els.poolLabel.textContent = `數卡區（共 ${q.digits.length} 張）`;
        }

        function formedText() {
            const parts = slots.map(c => c ? String(c.digit) : '—');
            return `你排出的數：<b>${parts.join(' ')}</b>`;
        }

        function createCardEl(card, inSlot, slotIdx) {
            const el = document.createElement('div');
            el.className = `num-card ${card.theme}` + (selectedId === card.id ? ' selected' : '');
            el.dataset.cardId = card.id;
            el.setAttribute('role', 'button');
            el.tabIndex = 0;
            el.setAttribute('aria-label', '數卡 ' + card.digit);
            el.innerHTML = `
                <span class="card-animal">${card.animal}</span>
                <div class="card-digit">${card.digit}</div>
            `;
            bindCard(el, card, inSlot, slotIdx);
            return el;
        }

        function renderBoard() {
            els.slots.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const wrap = document.createElement('div');
                wrap.className = 'place';
                const slot = document.createElement('div');
                slot.className = 'slot' + (slots[i] ? ' filled' : '');
                slot.dataset.slotIndex = i;
                slot.setAttribute('aria-label', '答案格 ' + (i + 1));
                if (slots[i]) slot.appendChild(createCardEl(slots[i], true, i));
                else slot.innerHTML = `<span class="slot-ph">✦</span>`;
                slot.addEventListener('click', () => onSlotTap(i));
                wrap.appendChild(slot);
                els.slots.appendChild(wrap);
            }

            els.pool.innerHTML = '';
            pool.forEach(card => {
                const wrap = document.createElement('div');
                wrap.className = 'pool-slot';
                wrap.appendChild(createCardEl(card, false, null));
                els.pool.appendChild(wrap);
            });

            els.formed.innerHTML = formedText();
            els.checkBtn.disabled = locked || slots.some(s => !s);
        }

        function bindCard(el, card, inSlot, slotIdx) {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                if (locked || el.dataset.didDrag === '1') {
                    el.dataset.didDrag = '0';
                    return;
                }
                sound.pick();
                if (inSlot) {
                    slots[slotIdx] = null;
                    pool.push(card);
                    selectedId = null;
                    renderBoard();
                    return;
                }
                const empty = slots.findIndex(s => !s);
                if (empty !== -1) {
                    slots[empty] = card;
                    pool = pool.filter(c => c.id !== card.id);
                    selectedId = null;
                    sound.drop();
                    renderBoard();
                } else {
                    selectedId = selectedId === card.id ? null : card.id;
                    renderBoard();
                }
            });

            el.addEventListener('pointerdown', (e) => {
                if (locked || (e.button && e.button !== 0)) return;
                const startX = e.clientX;
                const startY = e.clientY;
                let dragging = false;
                drag = { card, inSlot, slotIdx };

                const move = (ev) => {
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    if (!dragging && (dx * dx + dy * dy) < 64) return;
                    if (!dragging) {
                        dragging = true;
                        el.dataset.didDrag = '1';
                        ghost = el.cloneNode(true);
                        ghost.classList.add('dragging');
                        ghost.style.width = el.offsetWidth + 'px';
                        ghost.style.height = el.offsetHeight + 'px';
                        document.body.appendChild(ghost);
                    }
                    ghost.style.left = (ev.clientX - ghost.offsetWidth / 2) + 'px';
                    ghost.style.top = (ev.clientY - ghost.offsetHeight / 2) + 'px';
                    highlight(ev.clientX, ev.clientY);
                };
                const up = (ev) => {
                    document.removeEventListener('pointermove', move);
                    document.removeEventListener('pointerup', up);
                    if (ghost) { ghost.remove(); ghost = null; }
                    if (dragging) {
                        dropAt(ev.clientX, ev.clientY);
                        clearHighlight();
                    }
                    drag = null;
                };
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', up);
            });
        }

        function onSlotTap(i) {
            if (locked || !selectedId) return;
            const card = pool.find(c => c.id === selectedId);
            if (!card) return;
            if (slots[i]) pool.push(slots[i]);
            slots[i] = card;
            pool = pool.filter(c => c.id !== selectedId);
            selectedId = null;
            sound.drop();
            renderBoard();
        }

        function highlight(x, y) {
            clearHighlight();
            const el = document.elementFromPoint(x, y);
            const slot = el && el.closest('#slots .slot');
            if (slot) slot.classList.add('slot-highlight');
        }
        function clearHighlight() {
            document.querySelectorAll('.slot-highlight').forEach(s => s.classList.remove('slot-highlight'));
        }

        function dropAt(x, y) {
            if (!drag) return;
            const { card, inSlot, slotIdx } = drag;
            drag = null;
            if (locked) return;
            const el = document.elementFromPoint(x, y);
            if (!el) return;
            const targetSlot = el.closest('#slots .slot');
            const targetPool = el.closest('#pool');

            if (targetSlot) {
                const idx = Number(targetSlot.dataset.slotIndex);
                if (inSlot && idx === slotIdx) return;
                if (inSlot) slots[slotIdx] = null;
                else pool = pool.filter(c => c.id !== card.id);
                if (slots[idx]) pool.push(slots[idx]);
                slots[idx] = card;
                sound.drop();
                renderBoard();
            } else if (targetPool && inSlot) {
                slots[slotIdx] = null;
                pool.push(card);
                sound.drop();
                renderBoard();
            }
        }

        function loadQuestion() {
            const q = currentQ();
            cards = makeCards(q);
            slots = [null, null, null, null, null];
            pool = shuffle(cards);
            selectedId = null;
            tries = 0;
            locked = false;
            els.checkBtn.hidden = false;
            els.nextBtn.hidden = true;
            renderHeader();
            setSpeech(q.intro, '', q.mixed ? '🦉' : '🦊');
            renderBoard();
        }

        function studentNumber() {
            if (slots.some(s => !s)) return null;
            if (slots[0].digit === 0) {
                const val = slots[1].digit * 1000 + slots[2].digit * 100 + slots[3].digit * 10 + slots[4].digit;
                return { n: val, leadingZero: true };
            }
            const val = slots[0].digit * 10000 + slots[1].digit * 1000 + slots[2].digit * 100 + slots[3].digit * 10 + slots[4].digit;
            return { n: val, leadingZero: false };
        }

        function checkAnswer() {
            if (slots.some(s => !s) || locked) return;
            const q = currentQ();
            const got = studentNumber();
            const ok = !got.leadingZero && q.valid.some(a => a.n === got.n);

            if (ok) {
                locked = true;
                sound.success();
                const gained = tries === 0 ? 3 : tries === 1 ? 2 : 1;
                stars += gained;
                els.starText.textContent = stars;
                els.starText.parentElement.classList.remove('pop');
                void els.starText.parentElement.offsetWidth;
                els.starText.parentElement.classList.add('pop');
                const p = PRAISE[qIndex % PRAISE.length];
                const sticker = STICKERS[qIndex % STICKERS.length];
                stickers.push(sticker);
                setSpeech(p.title + p.text, `這題得到 ${gained} 顆星！${sticker}`, '🥳', 'reward');
                els.checkBtn.hidden = true;
                els.nextBtn.hidden = false;
                els.nextBtn.innerHTML = qIndex === lastEasyIndex()
                    ? '進入進階挑戰 →'
                    : qIndex === QUESTIONS.length - 1
                        ? '看成績 🏆'
                        : '下一題 →';
                launchConfetti();
            } else {
                sound.error();
                tries += 1;
                els.slots.classList.add('shake');
                setTimeout(() => els.slots.classList.remove('shake'), 450);
                const titles = ['差一點！再看一次題目要求。', '我再給你更清楚的提示。', '跟著這條線索排看看。'];
                let hint;
                if (tries === 1) hint = diagnose(got.n, got.leadingZero, q.req, q.valid);
                else if (tries === 2) hint = q.hints.conceptual + q.hints.hundred;
                else hint = q.hints.answer;
                setSpeech(q.intro, titles[Math.min(tries - 1, 2)] + hint, '🦉');
                els.reqRow.classList.remove('emphasize');
                void els.reqRow.offsetWidth;
                els.reqRow.classList.add('emphasize');
            }
        }

        function nextQuestion() {
            if (qIndex === lastEasyIndex()) {
                showMixIntro();
                return;
            }
            if (qIndex >= QUESTIONS.length - 1) {
                showEnd();
                return;
            }
            qIndex += 1;
            loadQuestion();
        }

        function showModal(html) {
            els.modalCard.innerHTML = html;
            els.modal.classList.add('show');
        }
        function closeModal() { els.modal.classList.remove('show'); }

        function showMixIntro() {
            showModal(`
                <div class="overlay-emoji">🧩</div>
                <h2>進階挑戰開始！</h2>
                <p>接下來的題目難度升級！除了混合要求外，還會有<b>6張數卡選5張</b>排成五位數的挑戰！</p>
                <p style="margin-top:8px;">仔細看清楚標籤，淘汰不需要的數卡吧。</p>
                <button class="btn btn-play" id="mix-go" style="margin-top:14px;">我準備好了！</button>
            `);
            document.getElementById('mix-go').onclick = () => {
                closeModal();
                qIndex += 1;
                loadQuestion();
            };
        }

        function showEnd() {
            const maxStars = QUESTIONS.length * 3;
            const msg = stars >= maxStars - 3 ? '五位數小達人就是你！'
                : stars >= Math.floor(maxStars * 0.7) ? '表現很棒，六選五難不倒你！'
                : '已經學會按要求排出五位數了，再玩一次會更好！';
            showModal(`
                <div class="overlay-emoji">🦄</div>
                <h2>全部完成！</h2>
                <div class="sticker-row">${stickers.join(' ') || '🌟 🏆 🌈'}</div>
                <div class="end-stars">${'⭐'.repeat(Math.max(3, Math.round(stars / Math.max(1, QUESTIONS.length))))}</div>
                <div class="end-score">${stars} / ${maxStars} 顆星</div>
                <p style="margin:10px 0 18px;">${msg}</p>
                <button class="btn btn-play" id="replay-btn">再玩一次</button>
            `);
            launchConfetti();
            sound.success();
            document.getElementById('replay-btn').onclick = () => {
                closeModal();
                startGame();
            };
        }

        function resetSlots() {
            if (locked) return;
            slots = [null, null, null, null, null];
            pool = shuffle(cards);
            selectedId = null;
            sound.pick();
            renderBoard();
        }

        function startGame() {
            QUESTIONS = generateRound();
            qIndex = 0;
            stars = 0;
            stickers = [];
            closeModal();
            showScreen('play');
            loadQuestion();
        }

        function launchConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            canvas.style.display = 'block';
            const colors = ['#ff8fb3', '#6ec8ff', '#ffe066', '#6fe0c0', '#c9a7ff', '#ffb347'];
            const bits = Array.from({ length: 120 }, () => ({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 16,
                vy: Math.random() * -12 - 4,
                s: Math.random() * 8 + 5,
                c: colors[Math.floor(Math.random() * colors.length)],
                r: Math.random() * 360,
                rs: (Math.random() - 0.5) * 12,
                life: 90
            }));
            function tick() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                bits.forEach(p => {
                    if (p.life <= 0) return;
                    alive = true;
                    p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.r += p.rs; p.life -= 1.3;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.r * Math.PI / 180);
                    ctx.globalAlpha = Math.max(0, p.life / 90);
                    ctx.fillStyle = p.c;
                    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
                    ctx.restore();
                });
                if (alive) requestAnimationFrame(tick);
                else canvas.style.display = 'none';
            }
            tick();
        }

        function refreshStartSamples() {
            const nums = shuffle([1,2,3,4,5,6,7,8,9]).slice(0, 5);
            document.querySelectorAll('.mini-card').forEach((el, i) => {
                if (nums[i] != null) el.textContent = nums[i];
            });
        }

        els.startBtn.addEventListener('click', startGame);
        els.checkBtn.addEventListener('click', checkAnswer);
        els.nextBtn.addEventListener('click', nextQuestion);
        els.resetBtn.addEventListener('click', resetSlots);
        els.homeBtn.addEventListener('click', () => {
            refreshStartSamples();
            showScreen('start');
            closeModal();
        });
        els.soundBtn.addEventListener('click', () => {
            sound.muted = !sound.muted;
            els.soundBtn.textContent = sound.muted ? '🔇' : '🔊';
        });
        els.modal.addEventListener('click', (e) => {
            if (e.target === els.modal) closeModal();
        });
        window.addEventListener('resize', () => {
            const c = document.getElementById('confetti');
            c.width = innerWidth; c.height = innerHeight;
        });
        refreshStartSamples();
    </script>
</body>
</html>
